<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: 52W High & Low</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #34495e; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 34px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #34495e; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #f4f6f7; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #34495e; box-sizing: border-box; }
        .big-text { font-size: 26px; color: #2c3e50; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #34495e; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">52W HIGH / LOW</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#34495e" stroke-width="2"><path d="M12 3v18M12 3l4 4M12 3L8 7M12 21l4-4M12 21l-4-4"/></svg>
            <div style="font-weight:bold; margin-top:10px;">The Year's Price Range</div>
        </div>
        <div class="main-def">
            <span class="big-text">MOST & LEAST</span>
            <span>The highest and lowest price paid this year.</span>
        </div>
        <div class="example">
            This year, the stand's price jumped to <b>$150</b> (High) and dropped to <b>$80</b> (Low).
        </div>
        <div class="pill">THE PRICE LIMITS! 📏</div>
    </div>
</body>
</html>
