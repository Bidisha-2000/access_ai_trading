<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: EPS</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #27ae60; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 42px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #27ae60; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #e8f5e9; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #27ae60; box-sizing: border-box; }
        .big-text { font-size: 28px; color: #1b5e20; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #27ae60; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">EPS</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2"/></svg>
            <div style="font-weight:bold; margin-top:10px;">Earnings Per Share</div>
        </div>
        <div class="main-def">
            <span class="big-text">YOUR SLICE</span>
            <span>Profit for every single share you own.</span>
        </div>
        <div class="example">
            If the stand makes $100 profit and has 100 owners, each owner gets $1. Your <b>EPS</b> is $1.
        </div>
        <div class="pill">HOW MUCH FOR YOU? 🍰</div>
    </div>
</body>
</html>
