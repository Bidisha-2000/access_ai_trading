<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: Free Cash Flow</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #8e44ad; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 38px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #8e44ad; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #f3e5f5; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #8e44ad; box-sizing: border-box; }
        .big-text { font-size: 28px; color: #4a148c; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #8e44ad; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">FREE CASH FLOW</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#8e44ad" stroke-width="2"><path d="M12 2L15 5M12 2L9 5M12 2V14"/><path d="M20 16C20 18.2091 16.4183 20 12 20C7.58172 20 4 18.2091 4 16"/></svg>
            <div style="font-weight:bold; margin-top:10px;">Cash to Use</div>
        </div>
        <div class="main-def">
            <span class="big-text">SPENDING MONEY</span>
            <span>Cash the business can save or spend.</span>
        </div>
        <div class="example">
            The cash in your jar that isn't promised to anyone. You can use it to <b>buy a bigger sign</b> next time.
        </div>
        <div class="pill">MONEY TO GROW! 🚀</div>
    </div>
</body>
</html>
