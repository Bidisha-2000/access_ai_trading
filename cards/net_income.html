<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: Net Income</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #2980b9; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 40px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #2980b9; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #e3f2fd; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #2980b9; box-sizing: border-box; }
        .big-text { font-size: 28px; color: #0d47a1; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #2980b9; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">NET INCOME</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2980b9" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M7 12L10 15L17 8"/></svg>
            <div style="font-weight:bold; margin-top:10px;">The Final Amount</div>
        </div>
        <div class="main-def">
            <span class="big-text">TAKE-HOME PAY</span>
            <span>Money you keep after ALL bills are paid.</span>
        </div>
        <div class="example">
            Pay for lemons, sugar, <b>AND</b> the table rent and ads. What stays in your pocket is Net Income.
        </div>
        <div class="pill">THE REAL EARNINGS! 💰</div>
    </div>
</body>
</html>
