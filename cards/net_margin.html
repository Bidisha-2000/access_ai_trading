<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: Net Margin %</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #2980b9; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 38px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #2980b9; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #ebf5fb; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #2980b9; box-sizing: border-box; }
        .big-text { font-size: 28px; color: #154360; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #2980b9; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">NET MARGIN %</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2980b9" stroke-width="2"><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font-weight:bold; margin-top:10px;">The Final Efficiency</div>
        </div>
        <div class="main-def">
            <span class="big-text">FINAL PERCENTAGE</span>
            <span>What % do you keep after ALL costs?</span>
        </div>
        <div class="example">
            After paying for ingredients, stand rent, and taxes, you might only keep <b>10 cents</b> of your $1. That’s a <b>10%</b> Net Margin.
        </div>
        <div class="pill">THE REAL BOTTOM LINE! ✅</div>
    </div>
</body>
</html>
