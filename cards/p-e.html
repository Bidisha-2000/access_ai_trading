<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: P/E Ratio</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #d35400; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 40px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #d35400; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #fdf2e9; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #d35400; box-sizing: border-box; }
        .big-text { font-size: 28px; color: #a04000; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #d35400; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">P/E RATIO</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d35400" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/><circle cx="12" cy="12" r="10" stroke-opacity="0.2"/></svg>
            <div style="font-weight:bold; margin-top:10px;">Price ÷ Profit</div>
        </div>
        <div class="main-def">
            <span class="big-text">THE PRICE TAG</span>
            <span>How much are you paying for $1 of profit?</span>
        </div>
        <div class="example">
            If the stand makes $1 a year, and you pay $10 to buy it, your <b>P/E Ratio</b> is 10.
        </div>
        <div class="pill">IS IT CHEAP OR PRICY? 🏷️</div>
    </div>
</body>
</html>
