<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard: Volatility</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; font-family: 'Verdana', sans-serif; }
        .flashcard { background-color: #ffffff; width: 400px; min-height: 600px; border: 5px solid #c0392b; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; box-sizing: border-box; }
        .word { font-size: 38px; font-weight: bold; color: #1a252f; text-transform: uppercase; margin: 0; }
        .visual { background: #fafafa; border: 2px dashed #c0392b; border-radius: 15px; width: 100%; padding: 20px 0; margin: 15px 0; }
        .main-def { background-color: #f9ebeb; padding: 20px; border-radius: 15px; width: 100%; border-left: 8px solid #c0392b; box-sizing: border-box; }
        .big-text { font-size: 28px; color: #7b241c; font-weight: bold; display: block; margin-bottom: 5px; }
        .example { background-color: #fff9c4; padding: 15px; border-radius: 15px; width: 100%; margin-top: 15px; border: 2px solid #fbc02d; box-sizing: border-box; font-size: 17px; line-height: 1.4; }
        .pill { margin-top: 15px; background-color: #c0392b; color: white; padding: 10px 20px; border-radius: 50px; font-size: 18px; font-weight: bold; width: 80%; }
        svg { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="flashcard">
        <h1 class="word">VOLATILITY</h1>
        <div class="visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font-weight:bold; margin-top:10px;">The Rollercoaster</div>
        </div>
        <div class="main-def">
            <span class="big-text">PRICE JUMPS</span>
            <span>How fast and wild the price moves up or down.</span>
        </div>
        <div class="example">
            If the stand price goes from $10 to $100 and back to $5 in one day, that is <b>High Volatility</b>.
        </div>
        <div class="pill">A BUMPY RIDE! 🎢</div>
    </div>
</body>
</html>
